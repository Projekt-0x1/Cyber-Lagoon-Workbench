name: hardening-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hardening/vital-workbench-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hardening/vital-workbench-boundary
          fetch-depth: 0

      - name: Refresh publication receipt in working tree
        run: ./verify --refresh-manifest

      - name: Validate reference build boundary
        run: ./build --reference-only --reset-reference

      - name: Validate compile-free bench
        run: ./bench --no-ir

      - name: Validate public verifier
        run: ./verify

      - name: Reject symlinked state root
        run: |
          rm -rf .state
          ln -s /tmp .state
          if ./build --reference-only; then
            echo 'build accepted a symlinked .state root' >&2
            exit 1
          fi
          rm .state
          ./build --reference-only --reset-reference

      - name: Install pinned Claude Code body
        run: npm install --global @anthropic-ai/claude-code@2.1.257

      - name: Validate isolated Claude body against local Adult gateway
        env:
          WORKBENCH_SENTINEL_SECRET: must-not-cross-body-boundary
        run: |
          result="$(./adult --prompt 'heavy rain soaks the garden')"
          printf '%s\n' "$result"
          RESULT="$result" python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ['RESULT'].splitlines()[-1])
          assert payload.get('total_cost_usd') in (0, 0.0, None), payload
          text = payload.get('result', '')
          assert isinstance(text, str) and text.strip(), payload
          PY

      - name: Re-verify after continuing contact
        run: ./verify

      - name: Commit refreshed publication receipt after all checks pass
        run: |
          if git diff --quiet -- EXPORT_MANIFEST.json; then
            echo 'publication receipt already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXPORT_MANIFEST.json
          git commit -m 'Refresh public export manifest after hardening'
          git push origin HEAD:hardening/vital-workbench-boundary
